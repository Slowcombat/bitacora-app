name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        id: compilar
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Publicar el APK y el registro en la rama builds
        if: always()
        run: |
          mkdir -p /tmp/salida
          cp build.log /tmp/salida/build.log || true
          cp app/build/outputs/apk/release/app-release.apk /tmp/salida/bitacora.apk || true
          echo "${{ github.sha }} ${{ steps.compilar.outcome }} build-${{ github.run_number }}" > /tmp/salida/estado.txt
          cd /tmp/salida
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.run_number }}: ${{ steps.compilar.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Subir el APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-apk
          path: app/build/outputs/apk/release/app-release.apk
